name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra xsd

      - name: Lint
        run: uv run --frozen --extra xsd ruff check .

      - name: Check formatting
        run: uv run --frozen --extra xsd ruff format --check .

      - name: Type-check
        run: uv run --frozen --extra xsd mypy src tests scripts examples

      - name: Test
        run: |
          mkdir -p build/coverage
          uv run --frozen --extra xsd pytest \
            --cov=src/nfse_br \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:build/coverage/coverage.json \
            --cov-fail-under=80

      - name: Enforce coverage gates
        run: >-
          uv run --frozen --extra xsd python scripts/check_coverage.py
          build/coverage/coverage.json

      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel typing
        run: >-
          uv run --frozen --extra xsd python
          scripts/smoke_typed_wheel.py
          dist/nfse_br-0.4.1-py3-none-any.whl

      - name: Smoke-test base wheel without XSD dependencies
        run: python scripts/smoke_base_wheel.py dist/nfse_br-0.4.1-py3-none-any.whl

  windows-compatibility:
    name: windows-compatibility (${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Confirm Windows runner
        run: python -c "import os; assert os.name == 'nt'; print(os.name)"

      - name: Install dependencies
        run: uv sync --frozen --extra xsd

      - name: Lint
        run: uv run --frozen --extra xsd ruff check .

      - name: Check formatting
        run: uv run --frozen --extra xsd ruff format --check .

      - name: Type-check
        run: uv run --frozen --extra xsd mypy src tests scripts examples

      - name: Prepare coverage directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/coverage | Out-Null

      - name: Test
        shell: pwsh
        run: |
          uv run --frozen --extra xsd pytest `
            --cov=src/nfse_br `
            --cov-branch `
            --cov-report=term-missing `
            --cov-report=json:build/coverage/coverage.json `
            --cov-fail-under=80

      - name: Enforce coverage gates
        run: uv run --frozen --extra xsd python scripts/check_coverage.py build/coverage/coverage.json

      - name: Build distributions
        run: uv build

      - name: Smoke-test installed wheel typing
        run: >-
          uv run --frozen --extra xsd python
          scripts/smoke_typed_wheel.py
          dist/nfse_br-0.4.1-py3-none-any.whl

      - name: Smoke-test base wheel without XSD dependencies
        run: python scripts/smoke_base_wheel.py dist/nfse_br-0.4.1-py3-none-any.whl
