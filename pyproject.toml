[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "nfse-br"
version = "0.5.0"
description = "Open-source Python toolkit for Brazil's National NFS-e ecosystem"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
  { name = "Cássio Santos" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
nfse-br = "nfse_br.cli:main"

[project.urls]
Homepage = "https://github.com/cassao29/nfse-br"
Issues = "https://github.com/cassao29/nfse-br/issues"
Repository = "https://github.com/cassao29/nfse-br"

[project.optional-dependencies]
xsd = [
    "lxml==6.1.3",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.7",
  "types-lxml==2026.2.16",
]

[tool.hatch.build]
exclude = ["/.agents", "/.claude", "/.f0", "/build", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/nfse_br"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nfse_br"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
